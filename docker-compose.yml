
services:
  db:
    image: postgres:18
    container_name: monster-tamers-db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: monster_tamers
      POSTGRES_USER: monster_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - monster_tamers_data:/var/lib/postgresql

volumes:
  monster_tamers_data:
