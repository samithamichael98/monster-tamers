name: Myth.exe - Automated Tests

on:
  push:
    branches:
      - main
      - feature/microservices-upgrade
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONSTER_DB_PASSWORD: ${{ secrets.MONSTER_DB_PASSWORD }}
      TEAM_DB_PASSWORD: ${{ secrets.TEAM_DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
      ENCOUNTER_DB_PASSWORD: ${{ secrets.ENCOUNTER_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest -v